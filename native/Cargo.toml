[package]
name = "hlg"
version = "0.2.0"
edition = "2021"
autobins = false
description = "HLG — a native Chinese high-school exploration roguelite"

[features]
qa = []

[dependencies]
macroquad = { version = "=0.4.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "hlg_core"
path = "src/lib.rs"

[[bin]]
name = "HLG"
path = "src/runtime.rs"
