const coordKey=n=>n.x+","+n.y+","+n.z;
function adjacent(a,b){if(a.x===b.x&&a.y===b.y&&typeof a.z==="number"&&typeof b.z==="number"&&Math.abs(a.z-b.z)===1)return true;if(a.z===b.z&&Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1)return true;if(a.x===b.x&&a.y===b.y&&a.z===b.z&&a.id!==b.id)return true;return false}
const edges=[];for(const a of Object.values(nodes))for(const b of Object.values(nodes))if(a.id<b.id&&adjacent(a,b))edges.push([a.id,b.id]);
function addLog(t){log.innerHTML="<div>· "+t+"</div>"+log.innerHTML}
function has(id,n=1){return state.inv.some(s=>s.id===id&&s.count>=n)}function addItem(id,c=1){const max=items[id][2];let left=c;for(const s of state.inv){if(s.id===id&&s.count<max){const a=Math.min(left,max-s.count);s.count+=a;left-=a;if(!left)break}}while(left>0){const a=Math.min(left,max);state.inv.push({id:id,count:a});left-=a}addLog("获得："+items[id][0]+" ×"+c);renderSide()}function removeItem(id,c=1){let left=c;for(let i=state.inv.length-1;i>=0&&left>0;i--){const s=state.inv[i];if(s.id!==id)continue;const a=Math.min(left,s.count);s.count-=a;left-=a;if(s.count<=0)state.inv.splice(i,1)}return left===0}

function typeOf(id){if(state.occupied[id])return"combat";const n=nodes[id];if(id==="classroom"&&!has("card"))return"locked";if(id==="chemical_storage"&&!state.firstDone.meet_wxh)return"locked";if(id==="dungeon"&&!state.firstDone.meet_ljx)return"locked";return n.baseType}
function visible(){const set=new Set([state.current]);for(const e of edges){if(e[0]===state.current)set.add(e[1]);if(e[1]===state.current)set.add(e[0])}if(state.equip==="stroke"){const c=nodes[state.current];for(const n of Object.values(nodes))if(n.z===c.z&&(n.x===c.x||n.y===c.y))set.add(n.id)}return set}
function canTravel(to){return edges.some(e=>(e[0]===state.current&&e[1]===to)||(e[1]===state.current&&e[0]===to))||to===state.current}
function selectNode(id){state.selected=id;renderMap();renderPreview()}
function enterSelected(){const id=state.selected;if(!id)return;if(!canTravel(id)){addLog("该节点不相邻，不能直接进入。");return}const t=typeOf(id);if(t==="locked"){addLog("节点锁定：需要对应权限、剧情或物品。");return}if(id!==state.current){const cost=t==="combat"?1:t==="event"?1:1;if(state.stamina<cost){rebirth("体力见底，循环重启。");return}state.stamina-=cost;state.current=id;addLog("进入："+nodes[id].name+"（体力 -"+cost+"）")}state.mode="scene";state.visited[id]=1;render()}

 const base=[["water",1,["stamina",1]],["snack",1,["stamina",1]],["match",2,["sanity",3]],["solution",1,["stamina",2]],["phlegm",1,["sanity",4]],["hook",1,["sanity",6]],["fuel",1,["sanity",8]],["alcohol",1,["stamina",3]]];

function refreshShop(id){if(state.stamina<1){rebirth("你无力继续刷新售卖机。");return}state.stamina--;state.shop[id]=makeShopSlots(id).sort(()=>Math.random()-.5).map((s,i)=>({...s,slot:i}));addLog("售卖机货架刷新为 2×4 格。");renderScene()}
function combatActions(id){const ent=state.occupied[id];if(!ent)return[];return [["观察敌对实体（理智-5，解锁信息）",()=>{state.sanity-=5;unlockInfo(ent+"_observe","教师实体/"+ent,"异常能力",ent+" 无法被真正击败，只能击退、弱化或暂时绕开。");renderScene()}],["掷骰攻击/击退",()=>rollCombat(id,ent)],["逃离战斗（体力-3）",()=>{if(state.stamina>=3){state.stamina-=3;state.mode="map";addLog("你逃离战斗。")}else rebirth("逃离失败。");render()}]]}
function rollCombat(id,ent){const atk=state.equip==="lamp"&&ent==="WXH"?8:state.equip==="stroke"?10:4;const def=ent==="WXH"?8:ent==="ZYY"?10:7;const a=1+Math.floor(Math.random()*atk),d=1+Math.floor(Math.random()*def);if(a>d){addLog("掷骰 "+a+"-"+d+"，"+ent+" 被击退，节点恢复原功能。");delete state.occupied[id];if(ent==="WXH"){state.firstDone.meet_wxh=1;unlockInfo("wxh_counter","教师实体/WXH","应对方式","自制酒精灯或足够强的装备可击退 WXH。")}if(ent==="ZYY"){unlockAch("first_immortal");addItem("thunder",1)}unlockAch(ent==="WXH"?"cut_grease":ent==="SGF"?"furnace_day":"hunting_time");render()}else{state.stamina=Math.max(0,state.stamina-2);state.sanity=Math.max(0,state.sanity-5);addLog("掷骰 "+a+"-"+d+"，被反制：体力-2，理智-5。");if(state.stamina<=0)rebirth("体力见底。");else renderScene()}}
function useItem(id){if(id==="water"){removeItem(id);state.stamina=Math.min(10,state.stamina+2);state.sanity=Math.min(100,state.sanity+5)}else if(id==="snack"){removeItem(id);state.stamina=Math.min(10,state.stamina+1)}else if(["lamp","stroke","wenjin","thunder"].includes(id)){state.equip=state.equip===id?null:id}render()}
function tryCraftLamp(){if(has("ink")&&has("solution")&&has("match")){removeItem("ink");removeItem("solution");removeItem("match");addItem("lamp");unlockInfo("lamp_recipe","物品档案","自制酒精灯","空墨水瓶、未知溶液、安全火柴可手动合成酒精灯。")}else addLog("合成失败：需要空墨水瓶、未知溶液、安全火柴。")}
function openMap(){state.mode="map";render()}function closeModal(id){document.getElementById(id).classList.remove("open")}
function renderMap(){const map=document.getElementById("map"),svg=document.getElementById("lines");map.querySelectorAll(".node").forEach(e=>e.remove());svg.innerHTML="";const vis=visible();for(const e of edges){if(!vis.has(e[0])&&!vis.has(e[1]))continue;const a=nodes[e[0]],b=nodes[e[1]],x1=a.x*100+80,y1=560-a.y*86-(a.z||0)*8,x2=b.x*100+80,y2=560-b.y*86-(b.z||0)*8,mx=(x1+x2)/2;const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d","M"+x1+" "+y1+" L"+mx+" "+y1+" L"+mx+" "+y2+" L"+x2+" "+y2);let cls="";if(typeOf(e[1])==="locked"||typeOf(e[0])==="locked")cls="locked";if(typeOf(e[1])==="combat"||typeOf(e[0])==="combat")cls="danger";if(state.selected&&(e[0]===state.selected||e[1]===state.selected))cls+=" sel";p.setAttribute("class",cls);svg.appendChild(p)}for(const id of vis){const n=nodes[id],div=document.createElement("div");div.className="node "+typeOf(id)+(id===state.current?" current":"")+(id===state.selected?" selected":"");div.style.left=(n.x*100+30)+"px";div.style.top=(540-n.y*86-(n.z||0)*8)+"px";div.textContent=n.name;div.onclick=()=>selectNode(id);map.appendChild(div)}}
function renderPreview(){const box=document.getElementById("preview"),btn=document.getElementById("enterBtn"),id=state.selected;if(!id){box.textContent="请选择节点。";btn.disabled=true;return}const n=nodes[id];box.innerHTML="<b>"+n.name+"</b><br>坐标：("+n.x+","+n.y+","+n.z+")<br>类型："+typeOf(id)+"<br>"+n.desc+"<br><span class='muted'>通路由 txt 坐标相邻自动生成。</span>";btn.disabled=false}
function renderScene(){
 const id=state.current,n=nodes[id],t=typeOf(id);sceneTitle.textContent=n.name+" · "+t;sceneText.textContent=n.desc;const body=document.getElementById("sceneBody");body.innerHTML="";
 const p=pickupItemsFor(id).filter(x=>!state.picked[id+":"+x[0]]);const sec=document.createElement("div");sec.className="scene-section";sec.innerHTML="<h3>可拾取物品</h3>";const pg=document.createElement("div");pg.className="pickup-grid";
 if(p.length){for(const [it,c] of p){const card=document.createElement("div");card.className="item";card.innerHTML="<b>"+items[it][0]+" ×"+c+"</b><br><span class='muted'>肯定可拿，拾取后从地点移除。</span><br>";card.onmousemove=ev=>showTooltip(ev,itemTipHtml(it));card.onmouseleave=hideTooltip;const b=document.createElement("button");b.textContent="拾取";b.onclick=()=>pickup(id,it,c);card.appendChild(b);pg.appendChild(card)}}else pg.innerHTML="<div class='muted'>没有可拾取物品。</div>";
 sec.appendChild(pg);body.appendChild(sec);
 const act=document.createElement("div");act.className="scene-section";act.innerHTML="<h3>节点行动</h3>";const choices=document.createElement("div");choices.className="choices";let acts=[];
 if(t==="event")acts=eventActions(id);if(t==="combat")acts=combatActions(id);
 if(t==="shop"){
  ensureShop(id);
  const note=document.createElement("p");note.className="shop-note";note.textContent="自动售卖机货架：2排 × 4列，格子样式与背包一致。鼠标悬停可查看物品与价格。";body.appendChild(note);
  const shelf=document.createElement("div");shelf.className="shelf";
  for(const s of state.shop[id]){
   const card=document.createElement("div");card.className="shop-slot"+(s.sold?" sold":"");card.onmousemove=ev=>showShopTip(ev,s);card.onmouseleave=hideTooltip;
   card.innerHTML="<span class='slot-index'>"+(s.slot+1)+"</span><div><div class='slot-name'>"+(s.sold?"已售空":items[s.item][0])+"</div><div class='slot-meta'>"+(s.sold?"这个格子只剩冷光。":"数量 ×"+s.count+"<br>价格："+priceText(s.price))+"</div></div>";
   const row=document.createElement("div");row.className="buy-row";row.innerHTML="<span class='slot-meta'>货架格</span>";
   if(!s.sold){const b=document.createElement("button");b.textContent="购买";b.onclick=()=>buy(id,s.slot);row.appendChild(b)}
   card.appendChild(row);shelf.appendChild(card)
  }
  body.appendChild(shelf);acts.push(["刷新货架（体力-1）",()=>refreshShop(id)])
 }
 if(t==="safe")acts.push(["休整：恢复体力",()=>{state.stamina=10;addLog("体力恢复。");render()}]);
 acts.push(["离开节点，返回地图",()=>openMap()]);
 for(const [label,fn] of acts){const b=document.createElement("button");b.textContent=label;b.onclick=fn;choices.appendChild(b)}
 act.appendChild(choices);body.appendChild(act);renderSide()
}
function renderSide(){placeName.textContent=nodes[state.current].name;modeName.textContent=state.mode==="map"?"视野地图":"节点内";stamina.textContent=state.stamina+"/10";sanity.textContent=state.sanity+"/100";vision.textContent=state.vision;equip.textContent=state.equip?items[state.equip][0]:"无";const box=inventory;box.innerHTML="";for(let i=0;i<10;i++){const s=state.inv[i],d=document.createElement("div");d.className="slot"+(s?" filled":"");d.textContent=s?items[s.id][0]+(s.count>1?" ×"+s.count:""):"空";if(s)d.onclick=()=>useItem(s.id);box.appendChild(d)}}
function render(){if(state.mode==="map"){mapView.classList.remove("hidden");sceneView.classList.add("hidden");renderMap();renderPreview();renderSide()}else{mapView.classList.add("hidden");sceneView.classList.remove("hidden");renderScene()}}
function openAch(){
 achModal.classList.add("open");
 const data=achievementData,tree=achTree,nodeW=132,nodeH=44,colGap=190,rowGap=64,left=26,top=34;
 tree.querySelectorAll(".ach").forEach(e=>e.remove());achLines.innerHTML="";
 const children={},by={};data.forEach(a=>{by[a.id]=a;(children[a.parent||"__none"]||(children[a.parent||"__none"]=[])).push(a.id)});
 let nextY=top;const pos={};
 function layout(id,depth){
  const kids=children[id]||[];
  if(!kids.length){pos[id]={x:left+depth*colGap,y:nextY};nextY+=rowGap;return pos[id].y}
  const ys=kids.map(k=>layout(k,depth+1));
  pos[id]={x:left+depth*colGap,y:ys.reduce((a,b)=>a+b,0)/ys.length};
  return pos[id].y;
 }
 (children.__none||[]).forEach(id=>layout(id,0));
 const maxDepth=Math.max(...Object.values(pos).map(p=>Math.round((p.x-left)/colGap)));
 tree.style.width=(left+(maxDepth+1)*colGap+260)+"px";tree.style.height=(nextY+80)+"px";achLines.setAttribute("width",tree.style.width);achLines.setAttribute("height",tree.style.height);
 function rightEdge(a){return pos[a.id].x+(a.shape==="major"?154:a.shape==="root"?126:nodeW)}
 for(const a of data){
  if(a.parent&&pos[a.parent]&&pos[a.id]){
   const p=by[a.parent],x1=rightEdge(p),y1=pos[a.parent].y+22,x2=pos[a.id].x,y2=pos[a.id].y+22;
   const path=document.createElementNS("http://www.w3.org/2000/svg","path");
   if(Math.abs(y1-y2)<1)path.setAttribute("d","M"+x1+" "+y1+" L"+x2+" "+y2);
   else{const m=(x1+x2)/2;path.setAttribute("d","M"+x1+" "+y1+" L"+m+" "+y1+" L"+m+" "+y2+" L"+x2+" "+y2)}
   if(state.ach[a.parent]&&state.ach[a.id])path.setAttribute("class","done-edge");
   achLines.appendChild(path)
  }
 }
 for(const a of data){
  const done=!!state.ach[a.id],available=!a.parent||state.ach[a.parent];
  const div=document.createElement("div");div.className="ach "+(a.shape||"")+" "+(done?"done":available?"available":"locked");div.style.left=pos[a.id].x+"px";div.style.top=pos[a.id].y+"px";div.textContent=(done?"✓ ":"")+a.name;div.onmousemove=ev=>showAchTip(ev,a);div.onmouseleave=hideTooltip;tree.appendChild(div)
 }
}
function openInfo(){infoModal.classList.add("open");const cats=[...new Set(Object.values(state.infos).map(i=>i.cat))];infoCats.innerHTML=(cats.length?cats:["暂无"]).map(c=>"<button onclick='showInfoCat(\""+c+"\")'>"+c+"</button>").join("");infoEntries.innerHTML="请选择分类。";infoText.textContent="玩家已知晓的真相会在这里按教师实体、地点、物品、深渊等分类归档。"}function showInfoCat(c){const list=Object.values(state.infos).filter(i=>i.cat===c);infoEntries.innerHTML=list.map((i,idx)=>"<button onclick='showInfoText(\""+c+"\","+idx+")'>"+i.title+"</button>").join("");infoText.textContent="请选择条目。"}function showInfoText(c,idx){const i=Object.values(state.infos).filter(x=>x.cat===c)[idx];infoText.innerHTML="<h3>"+i.title+"</h3><p>"+i.text+"</p>"}
function enterSelected(){const id=state.selected;if(!id)return;if(!canTravel(id)){addLog("不能直接抵达：节点不相邻。");return}if(typeOf(id)==="locked"){addLog("节点锁定，缺少权限或剧情条件。");return}if(id!==state.current){state.stamina--;if(state.stamina<0){rebirth("体力见底。");return}state.current=id;state.visited[id]=1;addLog("进入："+nodes[id].name)}state.mode="scene";render()}
function canTravel(id){return id===state.current||edges.some(e=>(e[0]===state.current&&e[1]===id)||(e[1]===state.current&&e[0]===id))}
addItem("water",1);addItem("snack",1);addLog("Demo v2：物品拾取、事件选项、商店货柜、战斗节点已拆分。");render();
</script>
